name: Release Production Android APK

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.3)"
        required: true
        default: "v1.0.3"
      release_name:
        description: "Release Title"
        required: false
        default: ""
      draft:
        description: "Draft Release (do not publish immediately)"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as Pre-release"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck & Run Unit Tests
        run: |
          npm test
          npx tsc --noEmit

      - name: Expo Prebuild (Generate Native Android Project with Config Plugins)
        run: npx expo prebuild --clean --no-install

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Assets & Checksums
        id: prepare_assets
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # Find output APK
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi

          echo "Discovered APK at: $APK_PATH"
          cp "$APK_PATH" "release-artifacts/SambayangReminder-${TAG}.apk"
          cp "$APK_PATH" "release-artifacts/SambayangReminder.apk"

          # Generate SHA-256 Checksums
          cd release-artifacts
          sha256sum SambayangReminder-${TAG}.apk > checksums.txt
          sha256sum SambayangReminder.apk >> checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload Build Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: SambayangReminder-Release-APK
          path: release-artifacts/*
          retention-days: 30

      - name: Publish or Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || format('Sambayang Reminder {0}', steps.prepare_assets.outputs.tag) }}
          body: |
            ### 🕌 Sambayang Reminder ${{ steps.prepare_assets.outputs.tag }}

            Official production release with in-app native updater engine, punctual exact alarms, and background Adhan recitation audio.

            #### ✨ Highlights:
            - **Seamless In-App Updates**: Updates download directly in-app with download progress and launch the native Android Package Installer without external browser redirection.
            - **Background Adhan Notifications**: Punctual high-priority prayer reminders bundling `adhan.mp3` and `fajr_adhan.mp3`.
            - **Exact Alarms**: Precision-timed salah notifications utilizing Android's `SCHEDULE_EXACT_ALARM`.
            - **Post-Salah Du'a & Adhkar**: Built-in authentic supplications, tasbih counters, and translations.

            #### 📲 Installation Options:
            1. **In-App Updater (Existing Users)**: Open Sambayang Reminder and tap **Update Now** when prompted. The new binary installs directly.
            2. **Fresh Installation**: Download `SambayangReminder.apk` below, tap the file, and choose **Install** (enable *Install unknown apps* for your browser or file manager if prompted).

            #### 🔒 Integrity Verification:
            See attached `checksums.txt` for SHA-256 cryptographic hashes.
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.txt
          draft: ${{ github.event.inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == true }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
